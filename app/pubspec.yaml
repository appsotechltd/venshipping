name: ven_shipping
description: VEN Shipping customer app. Register, get your China warehouse address and start shipping.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_white.png
    - assets/images/logo_dark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#17174A"
    theme_color: "#17174A"

# The screen the phone shows before Flutter starts: navy with the V mark, matching the in-app splash.
flutter_native_splash:
  color: "#17174A"
  image: assets/images/splash_mark.png
  android_12:
    color: "#17174A"
    image: assets/images/splash_mark.png
  web: false
